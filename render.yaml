services:
  - type: web
    name: silentbridge-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    # Liveness must not depend on the optional trained checkpoint.
    # /api/v1/ready remains the model-readiness diagnostic endpoint.
    healthCheckPath: /api/v1/health
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://visionbridge-2c7h.onrender.com
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"

  - type: static
    name: VisionBridge
    rootDir: frontend
    buildCommand: npm install && npm run build && cp -R dist/. .
    staticPublishPath: .
    envVars:
      - key: NODE_VERSION
        value: 20.19.5
      - key: VITE_API_BASE_URL
        value: https://silentbridge-backend-qpsn.onrender.com/api/v1
      # Explicit and intentional: real-mode is still blocked by the durable
      # database and production auth gates. Do not flip this here yet.
      - key: VITE_LOCAL_MODE
        value: "true"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

# SQLite remains only until the dedicated durable VisionBridge PostgreSQL
# service is provisioned and migrated in the next release gate.
