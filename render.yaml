services:
  - type: web
    name: visionbridge-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/ready
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://visionbridge-frontend.onrender.com
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: CALIBRATION_MIN_SECONDS
        value: "300"

  - type: web
    name: visionbridge-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://visionbridge-backend.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# SQLite is intentionally retained for the disposable demo deployment.
# Use an external managed database before treating this as durable production data.
