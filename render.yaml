services:
  - type: web
    name: visionbridge-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    # Liveness must not depend on the optional trained checkpoint.
    # /api/v1/ready remains the model-readiness diagnostic endpoint.
    healthCheckPath: /api/v1/health
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://visionbridge-2c7h.onrender.com
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"

  - type: web
    runtime: static
    name: visionbridge-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 20.19.5
      - key: VITE_API_BASE_URL
        value: https://silentbridge-backend-qpsn.onrender.com/api/v1
      # Production uses the real FastAPI API. Keep this explicit because frontend/src/api.ts
      # intentionally defaults to local/demo mode when the variable is absent.
      - key: VITE_LOCAL_MODE
        value: "false"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

# Production must provide DATABASE_URL through Render environment configuration.
# The backend now fails closed if production starts with the default SQLite database.
# The current Render service still needs durable PostgreSQL before persistent user data
# can be treated as production-grade.
