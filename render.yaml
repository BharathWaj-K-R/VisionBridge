services:
  - type: web
    name: visionbridge-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/ready
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://visionbridge-2c7h.onrender.com
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: CALIBRATION_MIN_SECONDS
        value: "300"

  - type: web
    runtime: static
    name: visionbridge-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build && cp -R dist/. .
    staticPublishPath: .
    envVars:
      - key: NODE_VERSION
        value: 20.19.5
      - key: VITE_API_BASE_URL
        value: https://visionbridge-backend.onrender.com/api/v1
      # Explicit and intentional, not an accidental default: frontend/src/api.ts
      # defaults LOCAL_MODE to true unless this is set to "false" at build time.
      # Keep this true until ALL of the following are true, then flip it:
      #   1. backend/app/models/weights/letter_base_model.pt is a real, retrained
      #      A-Z letter checkpoint (see AGENTS.md; the active /letter API depends
      #      on this frozen base before few-shot signer adapters can be fitted);
      #   2. the database is durable, not the ephemeral SQLite noted below;
      #   3. auth tokens are HttpOnly, not the current localStorage bearer token.
      # Flipping this to false before then would point the real live frontend at
      # a backend that cannot actually serve translations or retain user data.
      - key: VITE_LOCAL_MODE
        value: "true"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

# SQLite is intentionally retained for the disposable demo deployment.
# Use an external managed database before treating this as durable production data.
