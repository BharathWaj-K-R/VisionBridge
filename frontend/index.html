<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f6f4" />
    <meta name="description" content="VisionBridge, a real-time Indian Sign Language recognition workspace with hand skeleton tracking." />
    <title>VisionBridge</title>
    <script>
      // Compatibility guard for an existing Render static service that may still
      // publish frontend/ instead of frontend/dist. It redirects to the compiled
      // Vite artifact before the browser tries to execute /src/main.tsx.
      (function () {
        var path = window.location.pathname;
        if (!path.startsWith('/dist/')) {
          fetch('/dist/index.html', { cache: 'no-store' })
            .then(function (response) {
              if (response.ok) window.location.replace('/dist/index.html');
            })
            .catch(function () {});
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
