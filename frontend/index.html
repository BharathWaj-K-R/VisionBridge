<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f6f4" />
    <meta name="description" content="VisionBridge, a real-time Indian Sign Language recognition workspace with hand skeleton tracking." />
    <title>VisionBridge</title>
    <script>
      // Compatibility guard for an existing Render static service that may still
      // publish the repository's frontend/ directory instead of frontend/dist.
      // In that case, redirect to the compiled artifact before the browser tries
      // to execute the TypeScript source entrypoint.
      (function () {
        var path = window.location.pathname;
        if (path === '/' || path.endsWith('/index.html')) {
          fetch('/dist/index.html', { method: 'HEAD', cache: 'no-store' })
            .then(function (response) {
              if (response.ok) window.location.replace('/dist/index.html');
            })
            .catch(function () {});
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
