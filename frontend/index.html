  <style id="theme-critical">
    :root{
      --vb-bg:#f5f8f7;--vb-surface:#fff;--vb-soft:#edf4f2;--vb-text:#16302d;--vb-strong:#10221f;
      --vb-muted:#5f716e;--vb-line:#d6e2df;--vb-accent:#0f766e;--vb-accent-2:#0b5f59;
      --vb-focus:#1d4ed8;--vb-danger:#b42318;--vb-danger-soft:#fff1ef;color-scheme:light;
    }
    html[data-theme="dark"]{
      --vb-bg:#101514;--vb-surface:#161c1a;--vb-soft:#202a27;--vb-text:#edf7f4;--vb-strong:#fff;
      --vb-muted:#bbc8c4;--vb-line:#42504c;--vb-accent:#56c5b8;--vb-accent-2:#7de0d4;
      --vb-focus:#79a7ff;--vb-danger:#ff8f86;--vb-danger-soft:#321b1b;color-scheme:dark;
    }
    @media(prefers-color-scheme:dark){
      html:not([data-theme]){
        --vb-bg:#101514;--vb-surface:#161c1a;--vb-soft:#202a27;--vb-text:#edf7f4;--vb-strong:#fff;
        --vb-muted:#bbc8c4;--vb-line:#42504c;--vb-accent:#56c5b8;--vb-accent-2:#7de0d4;
        --vb-focus:#79a7ff;--vb-danger:#ff8f86;--vb-danger-soft:#321b1b;color-scheme:dark;
      }
    }
  </style>
  <script>
  (() => {
    try {
      const key = "theme-preference";
      const legacyKey = "visionbridge_theme";
      const isPreference = value => value === "light" || value === "dark" || value === "system";
      const primary = localStorage.getItem(key);
      const legacy = localStorage.getItem(legacyKey);
      const preference = isPreference(primary) ? primary : isPreference(legacy) ? legacy : "system";
      const root = document.documentElement;
      if (preference === "light" || preference === "dark") root.dataset.theme = preference;
      else root.removeAttribute("data-theme");
      root.dataset.themePreference = preference;
      const resolved = preference === "system"
        ? (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
        : preference;
      root.style.colorScheme = resolved;
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.content = resolved === "dark" ? "#101514" : "#f5f8f7";
    } catch {
      document.documentElement.removeAttribute("data-theme");
      document.documentElement.dataset.themePreference = "system";
    }
  })();
  </script>
