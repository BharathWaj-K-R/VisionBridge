<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f6f4" />
    <meta name="description" content="VisionBridge, a real-time Indian Sign Language recognition workspace with hand skeleton tracking." />
    <title>VisionBridge</title>
    <script>
      // Compatibility guard for an existing Render static service that may still
      // publish frontend/ instead of frontend/dist. The marker is copied only
      // into the Vite output, so a SPA rewrite cannot create a false positive.
      (function () {
        var path = window.location.pathname;
        if (!path.startsWith('/dist/')) {
          fetch('/dist/deploy-marker.txt', { cache: 'no-store' })
            .then(function (response) {
              if (!response.ok) return null;
              return response.text();
            })
            .then(function (marker) {
              if (marker && marker.trim() === 'VISIONBRIDGE_DIST_ARTIFACT') {
                window.location.replace('/dist/index.html');
              }
            })
            .catch(function () {});
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
