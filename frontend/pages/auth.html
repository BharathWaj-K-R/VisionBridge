<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in · VisionBridge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <link rel="stylesheet" href="/assets/css/style.css" />
  </head>
  <body>
    <div data-sb-nav></div>
    <main class="container-sb py-5" style="max-width: 720px;">
      <div class="sb-card" data-sb-reveal>
        <div class="card-body p-4 p-md-5">
          <div class="text-center mb-4">
            <span class="sb-badge"><i class="bi bi-shield-lock"></i> Account access</span>
            <h1 class="h2 mt-3 mb-2">Sign in to VisionBridge</h1>
            <p class="text-muted-2 mb-0">Anonymous translation remains available. Accounts are required for calibration, history, and signer adapters.</p>
          </div>

          <div class="btn-group w-100 mb-4" role="group" aria-label="Authentication mode">
            <button class="btn btn-primary-sb" type="button" data-auth-mode="login">Sign in</button>
            <button class="btn btn-ghost-sb" type="button" data-auth-mode="register">Create account</button>
          </div>

          <form data-auth-form>
            <div class="mb-3">
              <label class="form-label" for="authUsername">Username</label>
              <input id="authUsername" class="form-control" autocomplete="username" required minlength="1" maxlength="128" pattern="[A-Za-z0-9_.-]+" />
            </div>
            <div class="mb-3">
              <label class="form-label" for="authPassword">Password</label>
              <input id="authPassword" type="password" class="form-control" autocomplete="current-password" required minlength="8" maxlength="72" />
            </div>
            <button class="btn btn-primary-sb w-100" type="submit" data-auth-submit>Sign in</button>
            <div class="mt-3 small" data-auth-status role="status" aria-live="polite"></div>
          </form>
        </div>
      </div>
    </main>
    <div data-sb-footer></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/assets/js/config.js"></script>
    <script src="/assets/js/app.js"></script>
    <script src="/assets/js/auth.js"></script>
  </body>
</html>
